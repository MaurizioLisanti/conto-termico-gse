name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt || true
          pip install pytest
        # elysia-ai non è disponibile su PyPI — il fallback garantisce
        # che pytest sia sempre installato per i test.

      - name: Run tests
        run: pytest tests/ -q
